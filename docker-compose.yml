name: needle-bench

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: env/db.env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: env/redis.env
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30

  llm:
    build: ./llm
    restart: unless-stopped
    env_file: env/llm.env
    ports:
      - "127.0.0.1:8100:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,os;urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s

  back:
    build:
      context: .
      dockerfile: back/Dockerfile
    restart: unless-stopped
    env_file: env/back.env
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  front:
    build:
      context: .
      dockerfile: front/Dockerfile
    restart: unless-stopped
    env_file: env/front.env
    ports:
      - "8088:80"
    depends_on:
      back:
        condition: service_healthy

volumes:
  pgdata:
